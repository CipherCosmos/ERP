name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download
        working-directory: backend

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        working-directory: backend

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.out
          flags: backend

      - name: Build backend
        run: CGO_ENABLED=1 go build -o server ./cmd/server
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend Build
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linter (if configured)
        run: npm run lint || true
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: /api/v1

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: gbos-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: gbos-frontend:latest

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: docker-build
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend
        run: docker build -t gbos-backend:test ./backend

      - name: Build frontend
        run: docker build -t gbos-frontend:test ./frontend

      - name: Start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 10

      - name: Check backend health
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8080/api/v1/health && break || sleep 1
          done

      - name: Check frontend health
        run: |
          for i in {1..30}; do
            curl -s http://localhost/ > /dev/null && break || sleep 1
          done

      - name: Run smoke tests
        run: bash backend/scripts/smoke-test.sh || true

      - name: Cleanup
        if: always()
        run: docker-compose down -v
